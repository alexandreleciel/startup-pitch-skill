# Phase 2 only. Based on scripts/facts_template.yaml; example company data removed.
# Open questions come first because the founder is unavailable in this run.
open_questions:
  - "Is the pre-seed ask $750k or $1m, and what costed plan, current cash and monthly burn support the Q3 2027 shipment target?"
  - "Can the November 8 waitlist and Stripe exports substantiate 2,140 signups, 312 outstanding refundable deposits and $15,288 collected after refunds, duplicates and fees?"
  - "What measured performance, repeat use and safety results do the six prototypes show, and what remains before production and UL/FCC testing?"
  - "What evidence supports the $299 device price, fully loaded landed cost, $12/month subscription, 40%+ attach rate and 90%+ subscription margin?"
  - "Which investor types and geographies are first, and where is Hearthbox incorporated?"

company: Hearthbox
currency: USD
as_of: 2026-11-08
prepared_on: 2026-11-10
scope: "Phases 1 through 3 only; founder unavailable; no narrative, investor Q&A or deck."
date_basis: "Latest dated operating snapshot is 'nov 8' in notes/waitlist.txt. The year 2026 is inferred from the explicitly dated October 2026 BOM and this run, not confirmed by the snapshot itself. Undated documents retain undated status."
currency_basis: "USD is a working assumption from dollar-denominated notes, Austin prototypes and the reported US audience; the documents do not spell out the currency code."
evidence_policy: "Counts without underlying lists are assumptions, following references/metrics.md. Other documented observations can be facts with status unverified. Neither classification implies independent verification. Missing values remain [needs number]; no missing actual is set to zero."

facts:
  - id: product_description
    label: Product described by the founder
    value: "Countertop fermentation appliance with guided phone recipes and temperature, humidity and airflow control"
    unit: claim
    kind: fact
    status: unverified
    source: README.md
    note: "Description of the intended product; no measured control-performance or food-safety evidence supplied. 'First', 'actually works', 'no mold' and health claims are not validated claims."

  - id: round_stage
    label: Stated fundraising stage
    value: pre-seed
