  # ---- Market ----
  - id: sam
    label: Serviceable market, UK, Netherlands and Ireland, employers with 250+ staff, physiotherapy pathway only
    value: 1100000000
    unit: GBP/year
    kind: assumption
    status: unverified
    source: docs/market-sizing-2026.md#Method (bottoms-up)
    method: 15.6M employees at 250+ employers in the three countries x 18 percent annual MSK incidence x GBP 403 per case (6.2 sessions x GBP 65)
    note: founder chose this as the market figure on 2026-11-10. Booking value, not Kestrel revenue. The file notes that people who seek treatment are fewer than the 18 percent who report a problem.

  - id: sam_employees
    label: Employees at employers with 250+ staff, UK, Netherlands and Ireland
