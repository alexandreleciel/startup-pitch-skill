# Deliberately broken test ledger for the Meridian fixture. Expected: ledger_check.py exits 1.
# Planted errors, one per check:
#   (a) customers_current has no unit; nrr_memo has kind: guess and status: maybe; duplicate id pipeline_deals
#       round_profile has a string value but unit EUR instead of text (warning)
#   (b) ask is kind: fact with neither source nor derived_from
#   (c) arr_current is 520000 but derived_from mrr_current * 12 = 492000; mrr_cmgr is 0.25 but its ^ expression gives 0.116
#   (d) arr_memo has conflicts_with but status confirmed
#   (e) use of funds percentages sum to 110; amounts sum to 3.2M against a 3M ask; runway 12 months vs 7.1;
#       sam larger than tam; mrr_yoy_multiple 3.4 against a series that gives 2.15
#   (f) tam sourced from old/pitch-notes-2025.md (warning)
#   (g) with meridian-deck-good.json: the deck references fact:customers_current and fact:logo_churn_count,
#       and logo_churn_count is missing here
#   (h) cash sourced to a file that does not exist; mrr_current value 41000 which is not in the CSV;
#       pipeline_acv_total is a hand-computed sum without computed: true (warning that says to add it)

